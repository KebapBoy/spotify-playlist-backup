services:
  spotify-playlist-backup:
    build: .
    image: spotify-playlist-backup:latest
    restart: unless-stopped
    healthcheck:
      # unhealthy while the last run of any job failed (see /data/status.json)
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys
          try:
              status = json.load(open("/data/status.json"))
          except (OSError, ValueError):
              sys.exit(0)
          sys.exit(0 if all(job["ok"] for job in status.values()) else 1)
      interval: 5m
      timeout: 10s
      retries: 1
    environment:
      TZ: ${TZ}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_PLAYLIST_BACKUP_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_PLAYLIST_BACKUP_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_PLAYLIST_BACKUP_REDIRECT_URI}
      RUN_ON_STARTUP: ${SPOTIFY_PLAYLIST_BACKUP_RUN_ON_STARTUP:-false}
      SPOTIFY_AUTH_ONLY: ${SPOTIFY_PLAYLIST_BACKUP_AUTH_ONLY:-false}
    volumes:
      # holds config.yml, the Spotify token and status.json; must be writable by uid 1000
      - ./data:/data
